name: Backend Unit Tests

on:
  push:
    branches:
      - master
      - fix-user-email

  pull_request:
    branches:
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pymongo
          pip install python-dotenv

      - name: Run UserController Tests
        working-directory: backend
        run: |
          python -m pytest test/demo/test_usercontroller.py